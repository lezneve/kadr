[package]
name = "tauri-spike"
version = "0.1.0"
edition = "2024"

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Threading"] }

[build-dependencies]
tauri-build = "2.7.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
