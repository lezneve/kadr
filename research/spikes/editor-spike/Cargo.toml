[package]
name = "editor-spike"
version = "0.1.0"
edition = "2024"

# throwaway spike for stage 1 of the editor: frame hand-off to a child
# process, direct2d first paint (hardware vs software), gaussian blur and
# cpu readback. synthetic image only.
[dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Security", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Foundation_Numerics", "Win32_System_Performance"] }
windows-numerics = "0.3.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
